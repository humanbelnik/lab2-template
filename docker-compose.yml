version: "3"
services:
  postgres:
    image: library/postgres:13
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"

  cars:
    build:
      context: ./cars
    container_name: cars
    restart: on-failure
    depends_on:
      - postgres
    environment:
      SERVICE_PORT: "8070"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: program
      DB_PASSWORD: test
      DB_NAME: cars
    ports:
      - "8070:8070"

  payment:
    build:
      context: ./payment
    container_name: payment
    restart: on-failure
    depends_on:
      - postgres
    environment:
      SERVICE_PORT: "8050"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: program
      DB_PASSWORD: test
      DB_NAME: payments
    ports:
      - "8050:8050"

  rental:
    build:
      context: ./rental
    container_name: rental
    restart: on-failure
    depends_on:
      - postgres
    environment:
      SERVICE_PORT: "8060"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: program
      DB_PASSWORD: test
      DB_NAME: rentals
    ports:
      - "8060:8060"

  gateway:
    build:
      context: ./gateway
    container_name: gateway
    restart: on-failure
    depends_on:
      - cars
      - payment
      - rental
    environment:
      SERVICE_PORT: "8080"
      CARS_SERVICE_URL: "http://cars:8070"
      PAYMENT_SERVICE_URL: "http://payment:8050"
      RENTAL_SERVICE_URL: "http://rental:8060"
    ports:
      - "8080:8080"

volumes:
  db-data: